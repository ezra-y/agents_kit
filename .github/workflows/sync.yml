name: 验证与上游检查

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: python -m pip install uv

      - name: 测试
        run: uv run --with "PyYAML>=6,<7" python -m unittest discover -s tests

      - name: 静态检查
        run: |
          uvx ruff==0.16.0 check scripts/agents-kit scripts/agents_kit tests
          uvx ruff==0.16.0 format --check scripts/agents-kit scripts/agents_kit tests

      - name: 构建文档
        run: scripts/agents-kit docs build

      - name: 检查受管生成文件
        run: git diff --exit-code -- docs/skills.md docs/cli.md docs/architecture.md

      - name: 仓库体检
        run: scripts/agents-kit check --repo-only

      - name: 上传网页清册
        uses: actions/upload-artifact@v7
        with:
          name: skills-catalog-${{ github.sha }}
          path: docs/index.html
          if-no-files-found: error

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: python -m pip install uv

      - name: 检查全部上游
        run: scripts/agents-kit source check --all --json > "$RUNNER_TEMP/source-check.json"

      - name: 上传检查报告
        uses: actions/upload-artifact@v7
        with:
          name: source-check-${{ github.run_id }}
          path: ${{ runner.temp }}/source-check.json
          if-no-files-found: error

      - name: 更新待确认 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="上游技能待更新"
          changed=$(jq '[.results[] | select(.status == "changed")] | length' "$RUNNER_TEMP/source-check.json")
          failed=$(jq '.failures | length' "$RUNNER_TEMP/source-check.json")
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')

          if [ "$changed" -eq 0 ] && [ "$failed" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "本次定时检查全部通过，自动关闭。"
            fi
            exit 0
          fi

          changed_names=$(jq -r '[.results[] | select(.status == "changed") | .skill] | join(", ")' "$RUNNER_TEMP/source-check.json")
          failed_names=$(jq -r '[.failures[] | .skill] | join(", ")' "$RUNNER_TEMP/source-check.json")
          report_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '检测到 %s 个来源变化，%s 个检查失败。\\n\\n变化：%s\\n\\n失败：%s\\n\\n[查看完整报告](%s)' \
            "$changed" "$failed" "${changed_names:-无}" "${failed_names:-无}" "$report_url")

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
