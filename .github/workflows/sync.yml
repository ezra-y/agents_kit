name: 验证与上游检查

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: agents-kit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: python -m pip install uv

      - name: 测试
        run: uv run --with "PyYAML>=6,<7" python -m unittest discover -s tests

      - name: AI 口语学校插件测试
        working-directory: plugins/ai-speaking-school
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ai-speaking-school-venv
        run: uv run --extra dev pytest -q tests

      - name: 静态检查
        run: |
          uvx ruff==0.16.0 check scripts/agents-kit scripts/agents_kit tests
          uvx ruff==0.16.0 format --check scripts/agents-kit scripts/agents_kit tests

      - name: 构建文档
        run: scripts/agents-kit docs build

      - name: 检查受管生成文件
        run: git diff --exit-code -- 'docs/*.md'

      - name: 仓库体检
        run: scripts/agents-kit check --repo-only

      - name: 上传网页清册
        uses: actions/upload-artifact@v7
        with:
          name: skills-catalog-${{ github.sha }}
          path: docs/index.html
          if-no-files-found: error

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: python -m pip install uv

      - name: 自动更新安全的小改动
        run: |
          if ! scripts/agents-kit source update --all --auto-docs --yes --repo-only --json > "$RUNNER_TEMP/source-check.json"; then
            cat "$RUNNER_TEMP/source-check.json"
            exit 1
          fi

      - name: 生成人工审核报告
        run: |
          scripts/agents-kit source report "$RUNNER_TEMP/source-check.json" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "$RUNNER_TEMP/source-review.md"
          cat "$RUNNER_TEMP/source-review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-check.json
            ${{ runner.temp }}/source-review.md
          if-no-files-found: error

      - name: 提交自动更新
        run: |
          updated=$(jq '[.results[] | select(.status == "safe_update" and .applied)] | length' "$RUNNER_TEMP/source-check.json")
          if [ "$updated" -eq 0 ]; then
            echo "没有可自动更新的来源"
            exit 0
          fi

          git config user.name "skill-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            skills/ \
            plugins/ \
            sources.json \
            metadata.json \
            desired-installations.json \
            .claude-plugin/ \
            .agents/ \
            docs/
          git diff --cached --check
          scripts/agents-kit check --repo-only
          git diff --exit-code
          git status --short
          git commit -m "sync: 自动更新 ${updated} 个上游技能"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 更新有变化的上游待办
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/agents-kit source notify "$RUNNER_TEMP/source-check.json" \
            --repository "$GH_REPO" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --json
