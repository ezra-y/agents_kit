version: 2
purpose: 公共字段概念种子。官网先动态发现字段，再用本目录理解含义。此文件不保存任何用户具体答案，也不保存腾讯、阿里等网站的 HTML 名称和选项。
source_of_truth: knowledge/field-catalog.yaml；导入 knowledge.sqlite 的 catalog_fields_cache 只是运行期缓存。
status_levels:
- candidate
- verified
- stable
- deprecated
answer_scopes:
  global: 大多数公司可复用，例如姓名、手机号。
  profile_record: 绑定某条教育、经历或项目记录。
  company: 只对某家公司有效。
  job: 只对某个岗位有效。
  application: 只对本次申请有效。
  session: 只在当前会话有效，不长期保存。
answer_policies:
  extract_or_ask: 可从简历或附件确定，找不到再询问
  reuse_if_explicit: 只有用户曾明确回答过才能复用
  confirm_each_application: 历史答案存在也要按本次申请确认
  never_infer: 绝不能根据其他资料推断
